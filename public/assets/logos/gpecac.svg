<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- GPECAC Deep Teal Disc -->
  <circle cx="80" cy="80" r="76" fill="#09363d" />
  <circle cx="80" cy="80" r="70" fill="none" stroke="#e06d53" stroke-width="2.5" />
  <!-- Central Regional Network Nodes & Caribbean waves -->
  <circle cx="80" cy="66" r="26" fill="#13525c" stroke="#dfb75c" stroke-width="1.5" />
  <!-- Nodes connecting CA and Caribbean -->
  <circle cx="68" cy="62" r="5" fill="#dfb75c" />
  <circle cx="92" cy="62" r="5" fill="#dfb75c" />
  <circle cx="80" cy="74" r="5" fill="#e06d53" />
  <line x1="68" y1="62" x2="92" y2="62" stroke="#ffffff" stroke-width="1.8" />
  <line x1="68" y1="62" x2="80" y2="74" stroke="#ffffff" stroke-width="1.8" />
  <line x1="92" y1="62" x2="80" y2="74" stroke="#ffffff" stroke-width="1.8" />
  <!-- Caduceus / Health Torch -->
  <circle cx="80" cy="50" r="3.5" fill="#ffde59" />
  <line x1="80" y1="46" x2="80" y2="82" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <!-- Caribbean Wave base -->
  <path d="M 50 88 Q 65 84 80 88 Q 95 92 110 88" fill="none" stroke="#2aa3b0" stroke-width="2" stroke-linecap="round"/>
  <!-- Acronym & Title -->
  <text x="80" y="113" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#dfb75c" text-anchor="middle" letter-spacing="1.5">GPECAC</text>
  <text x="80" y="125" font-family="Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#ffffff" text-anchor="middle">GRUPO PROFESIONALES ENFERMERÍA</text>
  <text x="80" y="136" font-family="Arial, sans-serif" font-size="6.2" font-weight="bold" fill="#7ed5df" text-anchor="middle">CENTROAMÉRICA Y CARIBE</text>
</svg>
